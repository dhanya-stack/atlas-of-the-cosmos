name: Refresh NASA news and publish Atlas of the Cosmos

on:
  push:
    branches: [main]
  schedule:
    # 01:30 UTC = 07:00 IST. GitHub scheduled jobs may be delayed.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-of-the-cosmos-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official NASA feeds
        run: python scripts/update_news.py
      - name: Save latest feed snapshot to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news.js
          if ! git diff --cached --quiet; then
            git commit -m "Update NASA news snapshot"
            git push
          else
            echo "Nothing new to commit"
          fi
      - name: Prepare static website artifact
        run: |
          mkdir -p _site/data _site/assets
          cp index.html styles.css app.js _site/
          cp data/news.js data/news.json _site/data/
          cp assets/moon-background.png _site/assets/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy fresh website to Pages
        id: deployment
        uses: actions/deploy-pages@v4
